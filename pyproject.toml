[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-agent"
version = "0.2.0"
description = "A local-first personal assistant for documents, memory, research and social drafts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]
desktop = ["pywebview>=5.0"]
all = ["playwright>=1.40", "pywebview>=5.0"]

[project.scripts]
echo-ai = "echo_agent.cli:main"

[tool.setuptools.packages.find]
include = ["echo_agent*"]
